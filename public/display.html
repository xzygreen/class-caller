<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caller 大屏</title>
<link rel="stylesheet" href="tokens.css">
<style>
  /* 版面单位：取宽、高中更紧的一边（16:9 时 1u = 1vw）。
     1366×768、1080p、4K 等比缩放；超宽屏按高度收住，4:3 按宽度收住。 */
  :root { --u: min(1vw, 1.778vh); }

  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: var(--font-display);
    background: var(--ink-900);
    color: var(--on-ink-strong);
    cursor: none;
    display: grid;
    /* 列宽只取视口宽度、不随内容撑开：姓名字号由 JS 按容器宽度实测，
       容器宽度不能反过来取决于字号 */
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto 1fr auto;
    background-image:
      radial-gradient(circle at 1px 1px, rgba(160,185,235,.055) 1px, transparent 0),
      linear-gradient(180deg, var(--ink-800) 0%, var(--ink-900) 60%);
    background-size: 26px 26px, 100% 100%;
  }
  body.show-cursor { cursor: default; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }

  /* ============ 顶栏 ============ */
  .rail {
    display: flex; align-items: center; justify-content: space-between; gap: 2vw;
    padding: calc(2.2 * var(--u)) 3vw calc(1.6 * var(--u));
    border-bottom: 1px solid var(--ink-600);
  }
  .rail-l { display: flex; align-items: center; gap: calc(1.1 * var(--u)); min-width: 0; }
  .mark {
    width: max(6px, calc(.5 * var(--u))); height: max(26px, calc(2.2 * var(--u))); flex: none;
    background: var(--gold); border-radius: 2px;
  }
  #klass { font-size: max(18px, calc(1.9 * var(--u))); font-weight: 700; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* 班级编号章：与名称并列，颜色只是辅助 */
  #klassCode {
    font-family: var(--font-num); font-size: max(13px, calc(1.25 * var(--u))); font-weight: 800; letter-spacing: .06em;
    padding: .18em .6em; border-radius: 6px;
    background: var(--class-tint, var(--gold)); color: var(--ink-900);
  }
  #klassCode:empty { display: none; }
  html[data-class-color="blue"]   { --class-tint: #7FB0FF; }
  html[data-class-color="green"]  { --class-tint: #6FE0A6; }
  html[data-class-color="orange"] { --class-tint: #FFB466; }
  html[data-class-color="purple"] { --class-tint: #C9A8FF; }
  html[data-class-color="teal"]   { --class-tint: #6EDDDD; }
  html[data-class-color="red"]    { --class-tint: #FF9B92; }
  .rail-r {
    display: flex; align-items: center; gap: calc(1.2 * var(--u));
    font-size: max(14px, calc(1.35 * var(--u))); color: var(--on-ink-muted); flex: none;
  }
  #railClock { font-family: var(--font-num); font-weight: 600; color: var(--on-ink-body); }

  .conn { display: flex; align-items: center; gap: .5em; }
  .conn i {
    width: .55em; height: .55em;
    border-radius: 50%; background: var(--alert-on-ink);
    transition: background var(--t-mid) var(--ease-out);
  }
  .conn.ok i { background: var(--ok-on-ink); }
  .conn em { font-style: normal; color: var(--alert-on-ink); }
  .conn.ok em { color: var(--on-ink-muted); }

  /* 控件常驻、带文字：不用晃鼠标才能找到 */
  .ctl {
    display: inline-flex; align-items: center; gap: .45em; min-height: 40px; padding: 0 .8em;
    font: inherit; font-size: max(13px, calc(1.05 * var(--u))); font-weight: 600;
    color: var(--on-ink-muted); background: transparent; border: 1px solid var(--ink-600); border-radius: 8px; cursor: pointer;
    transition: color var(--t-fast) var(--ease-out), background var(--t-fast) var(--ease-out), border-color var(--t-fast) var(--ease-out);
  }
  .ctl:hover { color: var(--on-ink-strong); background: var(--ink-700); border-color: var(--ink-500); }
  .ctl svg { width: 1.15em; height: 1.15em; flex: none; }
  .ctl[aria-pressed="false"] { color: var(--on-ink-faint); }

  /* ============ 主舞台 ============ */
  .stage { display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; padding: 0 4vw; min-height: 0; position: relative; }
  /* 通知态要让内容撑满舞台，否则 #names 拿不到可用高度，多人时会溢出底栏 */
  body.active .stage, body.notice .stage { place-items: stretch; }

  /* ---- 待机：安静 ---- */
  #idle { text-align: center; }
  #clock {
    font-family: var(--font-num);
    font-size: calc(15 * var(--u)); font-weight: 200; line-height: .92;
    letter-spacing: -.04em;
  }
  #clock s { text-decoration: none; color: var(--on-ink-muted); }
  #date {
    margin-top: calc(2.4 * var(--u)); font-size: calc(2.1 * var(--u)); font-weight: 500;
    letter-spacing: .28em; text-indent: .28em; color: var(--on-ink-muted);
  }
  /* 待机也显示班级，方便巡检设备是否绑对了班 */
  #stageKlass {
    margin-top: calc(3.2 * var(--u)); font-size: calc(1.6 * var(--u)); font-weight: 700;
    letter-spacing: .32em; text-indent: .32em; color: var(--class-tint, var(--gold));
  }

  /* ---- 绑定错误：不进入任何班级 ---- */
  #bind { display: none; text-align: center; max-width: 70vw; }
  body.bind-error #idle, body.bind-error #call { display: none; }
  body.bind-error #bind { display: block; }
  #bind h1 {
    margin: 0 0 calc(2 * var(--u)); font-size: calc(5 * var(--u)); font-weight: 800; letter-spacing: .06em;
    color: var(--alert-on-ink);
  }
  #bind p { margin: 0; font-size: max(16px, calc(2 * var(--u))); line-height: 1.6; color: var(--on-ink-body); overflow-wrap: anywhere; }

  /* ---- 找人：老师 → 学生姓名 → 附加说明 → 收到 ---- */
  #call { display: none; width: 100%; height: 100%; }
  body.active #idle { display: none; }
  body.active #call { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr auto; }

  .kicker {
    justify-self: center;
    display: inline-flex; align-items: center; gap: calc(1.2 * var(--u));
    font-size: calc(1.7 * var(--u)); font-weight: 600;
    letter-spacing: .42em; text-indent: .42em;
    color: var(--gold); padding: calc(3.2 * var(--u)) 0 calc(2.6 * var(--u));
  }
  .kicker::before, .kicker::after {
    content: ""; display: block; width: calc(7 * var(--u)); height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold-dim));
  }
  .kicker::after { transform: scaleX(-1); }

  /* 字号与列数由 JS 按容器像素实测决定，因此 1080p/2K/4K/超宽屏一视同仁 */
  #names {
    display: grid; align-content: center; justify-items: center;
    width: 100%; height: 100%; min-width: 0; min-height: 0;
    padding-bottom: 12px;
  }
  /* 每个姓名都是真正的按钮：可聚焦、可键盘确认 */
  #names .name {
    position: relative; margin: 0; padding: 0; max-width: 100%;
    font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: left;
    border-radius: 6px;
  }
  #names .name b {
    display: block; font-size: 1em; font-weight: 800; line-height: 1.06;
    letter-spacing: .03em; color: #fff; white-space: nowrap;
    animation: reveal var(--t-slow) var(--ease-out) both;
    animation-delay: inherit;
  }
  /* 金色基线：既是结构标尺，也是显示进度（随剩余时间收短），确认后变绿并留满 */
  #names .rule {
    display: block; height: max(2px, .05em); margin-top: .16em; overflow: hidden;
    background: rgba(240,180,41,.18); border-radius: 2px; transform-origin: left;
    animation: rule var(--t-slow) var(--ease-out) both;
    animation-delay: inherit;
  }
  #names .rule i { display: block; height: 100%; background: var(--gold); transform-origin: left; }
  #names .name.acked b { color: var(--on-ink-body); }
  #names .name.acked .rule { background: rgba(69,217,142,.2); }
  #names .name.acked .rule i { background: var(--ok-on-ink); }
  #names .tick {
    position: absolute; top: -.02em; right: -.56em; width: .42em; height: .42em;
    color: var(--ok-on-ink); display: none;
  }
  #names .name.acked .tick { display: block; animation: pop var(--t-mid) var(--ease-out) both; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
  /* 状态恢复（刷新/重连）时直接呈现，不重放入场动画 */
  #names.restore b, #names.restore .rule { animation: none; }

  @keyframes reveal {
    from { opacity: 0; transform: translateY(calc(3 * var(--u))); filter: blur(14px); }
    to   { opacity: 1; transform: none; filter: blur(0); }
  }
  @keyframes rule { from { transform: scaleX(0); } to { transform: scaleX(1); } }

  /* ---- 留言：标题与正文居中；紧急：红色信号条，不整屏泛红 ---- */
  #notice { display: none; width: 100%; height: 100%; }
  body.notice #idle, body.notice #call { display: none; }
  body.notice #notice { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr auto; padding: 0 4vw; }
  body.urgent #notice .kicker { color: var(--alert-on-ink); }
  body.urgent #notice .kicker::before, body.urgent #notice .kicker::after { background: linear-gradient(90deg, transparent, #A3352C); }
  #urgentStrip {
    position: fixed; left: 0; right: 0; top: 0; z-index: 3; height: max(6px, calc(.7 * var(--u)));
    background: var(--alert-on-ink); display: none;
  }
  body.urgent #urgentStrip { display: block; }
  #noticeMain { display: grid; align-content: center; justify-items: center; min-height: 0; text-align: center; overflow: hidden; }
  #noticeTitle {
    font-size: clamp(32px, calc(5.2 * var(--u)), 9vh); font-weight: 800; letter-spacing: .04em; line-height: 1.2; color: #fff;
    overflow-wrap: anywhere; animation: reveal var(--t-slow) var(--ease-out) both;
  }
  #noticeTitle::after { content: ""; display: block; width: 18%; height: max(3px, .06em); margin: .35em auto 0; background: var(--gold); animation: rule var(--t-slow) var(--ease-out) both; }
  body.urgent #noticeTitle::after { background: var(--alert-on-ink); }
  #noticeBody {
    margin-top: calc(3.6 * var(--u)); max-width: 82vw; font-size: clamp(22px, calc(2.9 * var(--u)), 6vh); line-height: 1.6; color: var(--on-ink-strong);
    white-space: pre-wrap; overflow-wrap: anywhere; animation: reveal var(--t-slow) var(--ease-out) both; animation-delay: .1s;
  }
  #noticeAuthor { justify-self: end; padding: 0 2vw calc(3 * var(--u)); font-size: calc(1.7 * var(--u)); color: var(--on-ink-muted); font-weight: 600; }
  #noticeAuthor::before { content: "—— "; }
  #notice.restore #noticeTitle, #notice.restore #noticeBody, #notice.restore #noticeTitle::after { animation: none; }

  /* ---- 等待队列提示 ---- */
  #queueHint {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 4;
    padding: 5px 14px; border-radius: var(--r-pill); font-size: max(13px, calc(1 * var(--u)));
    background: rgba(20,28,48,.82); border: 1px solid var(--ink-600); color: var(--on-ink-muted);
  }
  #queueHint:empty { display: none; }

  /* ============ 「收到」按钮：呼吸光最多两轮，然后静止 ============ */
  #ackRow {
    display: flex; justify-content: center; align-items: center; gap: calc(1.2 * var(--u));
    padding: 0 0 calc(2.6 * var(--u));
  }
  #ack {
    display: inline-flex; align-items: center; justify-content: center; gap: .55em;
    min-width: calc(14 * var(--u)); min-height: 56px; padding: .55em 2.2em;
    font: inherit; font-size: max(22px, calc(2.3 * var(--u))); font-weight: 800;
    letter-spacing: .18em; text-indent: .18em;
    color: var(--ink-900); background: var(--gold);
    border: 0; border-radius: var(--r-pill); cursor: pointer;
    box-shadow: 0 12px 34px rgba(240,180,41,.28);
    transition: transform var(--t-fast) var(--ease-out), box-shadow var(--t-fast) var(--ease-out),
      background var(--t-mid) var(--ease-out), color var(--t-mid) var(--ease-out);
    animation: pulse 2.2s ease-in-out 2;
  }
  #ack:hover { transform: translateY(-2px); }
  #ack:active { transform: translateY(1px) scale(.98); }
  #ack svg { width: 1em; height: 1em; }
  #ack:disabled { cursor: default; animation: none; transform: none; box-shadow: none; }
  #ack.busy { opacity: .7; }
  #ack.done {
    background: rgba(69,217,142,.14); color: var(--ok-on-ink);
    box-shadow: inset 0 0 0 2px rgba(69,217,142,.55);
  }
  #ackNote { font-size: max(14px, calc(1.1 * var(--u))); color: var(--on-ink-muted); }
  #ackNote.bad { color: var(--alert-on-ink); }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(240,180,41,.55), 0 12px 34px rgba(240,180,41,.28); }
    50% { box-shadow: 0 0 0 14px rgba(240,180,41,0), 0 12px 34px rgba(240,180,41,.28); }
  }

  /* ============ 底栏 ============ */
  .foot {
    border-top: 1px solid var(--ink-600); padding: 0 3vw;
    display: grid; grid-template-rows: 0fr;
    transition: grid-template-rows var(--t-mid) var(--ease-out);
  }
  body.active .foot.has-msg { grid-template-rows: 1fr; }
  #message {
    overflow: hidden; font-size: calc(2.6 * var(--u)); font-weight: 700;
    color: var(--gold); text-align: center; overflow-wrap: anywhere;
  }
  #message span { display: block; padding: calc(2.4 * var(--u)) 0; }

  /* 留言的剩余时间条（找人的剩余时间由姓名基线承担） */
  #progress { height: 4px; margin: 0 -3vw; background: var(--ink-700); display: none; }
  body.notice #progress.on { display: block; }
  body.urgent #progress i { background: var(--alert-on-ink); }
  #progress i {
    display: block; height: 100%; background: var(--gold);
    transform-origin: left; transform: scaleX(1);
  }

  /* ============ 提示条 ============ */
  .toast {
    position: fixed; left: 50%; transform: translate(-50%, -12px);
    display: flex; align-items: center; gap: 10px;
    padding: 10px 20px; border-radius: var(--r-pill);
    font-size: max(14px, calc(1.05 * var(--u))); font-weight: 600;
    opacity: 0; pointer-events: none; z-index: 6;
    transition: opacity var(--t-mid) var(--ease-out), transform var(--t-mid) var(--ease-out);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  #reconnect {
    top: calc(2.4 * var(--u) + 6px); background: rgba(224,72,60,.16);
    border: 1px solid rgba(224,72,60,.5); color: var(--alert-on-ink);
  }
  #reconnect::before {
    content: ""; width: 13px; height: 13px; border-radius: 50%;
    border: 2px solid rgba(255,155,146,.3); border-top-color: var(--alert-on-ink);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #audioTip {
    left: 1.6vw; bottom: 14px; transform: translateY(6px);
    padding: 7px 15px; font-size: 14px;
    background: rgba(240,180,41,.14);
    border: 1px solid rgba(240,180,41,.45); color: var(--gold);
  }
  #audioTip.show { transform: none; }

  #launchWarning {
    top: 9vh; max-width: min(680px, 88vw); border-radius: var(--r-sm);
    background: rgba(224,72,60,.18); border: 1px solid rgba(224,72,60,.56);
    color: #FFD0CC; text-align: center; line-height: 1.5;
  }

  /* ============ 窄屏 / 竖屏：安全降级，不裁掉信息 ============ */
  #narrowHint {
    display: none; margin: 0; padding: 8px 14px; font-size: 14px; text-align: center;
    background: rgba(240,180,41,.12); color: var(--gold); border-bottom: 1px solid rgba(240,180,41,.3);
  }
  @media (orientation: portrait), (max-width: 900px) {
    :root { --u: 1.6vw; }
    html, body { overflow: auto; height: auto; min-height: 100%; }
    body { grid-template-rows: auto auto 1fr auto; min-height: 100vh; }
    #narrowHint { display: block; }
    .rail { flex-wrap: wrap; }
    .ctl .ctl-text { display: none; }
    body.active #call { min-height: 70vh; }
    #names { min-height: 40vh; }
  }
</style>
</head>
<body>

<header class="rail">
  <div class="rail-l">
    <span class="mark" aria-hidden="true"></span>
    <span id="klass">　</span>
    <span id="klassCode"></span>
  </div>
  <div class="rail-r">
    <span id="railClock" class="tnum">--:--</span>
    <span class="conn" id="conn" role="status"><i aria-hidden="true"></i><em>连接中</em></span>
    <button class="ctl" id="btnSound" type="button" aria-pressed="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M11 5 6 9H3v6h3l5 4z"/>
        <path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>
        <path class="mute" d="m17 9 5 6M22 9l-5 6" style="display:none"/>
      </svg>
      <span class="ctl-text" id="soundText">提示音 开</span>
    </button>
    <button class="ctl" id="btnFull" type="button" aria-label="全屏">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
      </svg>
      <span class="ctl-text" id="fullText">全屏</span>
    </button>
  </div>
</header>

<p id="narrowHint">当前窗口是竖屏或太窄，内容可能需要滚动查看。建议横屏并全屏显示。</p>

<main class="stage">
  <div id="urgentStrip" aria-hidden="true"></div>

  <section id="idle">
    <div id="clock">--<s>:</s>--</div>
    <div id="date"></div>
    <div id="stageKlass"></div>
  </section>

  <section id="bind" role="alert">
    <h1 id="bindTitle">班级绑定错误</h1>
    <p id="bindDetail"></p>
  </section>

  <section id="notice" aria-live="polite">
    <div id="noticeKind" class="kicker">班级留言</div>
    <div id="noticeMain">
      <div id="noticeTitle"></div>
      <div id="noticeBody"></div>
    </div>
    <div id="noticeAuthor"></div>
  </section>

  <section id="call" aria-live="polite">
    <div id="label" class="kicker">老师正在找</div>
    <div id="names" role="group" aria-label="被找的同学，点姓名可单独确认收到"></div>
    <div id="ackRow">
      <button id="ack" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5 9.5 18 20 6.5"/></svg>
        <span>收到</span>
      </button>
      <span id="ackNote" role="status"></span>
    </div>
  </section>
</main>

<footer class="foot" id="foot">
  <div id="message"><span></span></div>
  <div id="progress"><i></i></div>
</footer>

<div id="queueHint"></div>
<div class="toast" id="reconnect">正在重新连接…</div>
<div class="toast" id="audioTip">点一下画面开启提示音</div>
<div class="toast" id="launchWarning" role="alert">浏览器阻止了本地程序启动。请启用 classcaller 协议，或改用 D:\tools\win7-launcher.exe 原生监听模式后重新发送。</div>

<script src="display.js"></script>
</body>
</html>
