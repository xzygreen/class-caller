<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Caller · 管理端</title>
<link rel="stylesheet" href="tokens.css?v=2.1.8">
<link rel="stylesheet" href="ui.css?v=2.1.8">
<link rel="stylesheet" href="admin.css?v=2.1.8">
<link rel="icon" href="/favicon.ico?v=2.1.8" sizes="16x16 24x24 32x32 48x48 64x64 128x128 256x256">
<link rel="icon" href="/favicon.svg?v=2.1.8" type="image/svg+xml" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2.1.8">
</head>
<body>

<div id="gate" class="gate" hidden>
  <form id="loginForm">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">Caller</span><span class="brand-role">管理端</span></div>
    <h1>管理员登录</h1>
    <label for="loginUser">登录名</label>
    <input type="text" id="loginUser" autocomplete="username" required autocapitalize="off" spellcheck="false">
    <label for="loginPwd">密码</label>
    <input type="password" id="loginPwd" autocomplete="current-password" required>
    <p id="loginErr" class="err" role="alert"></p>
    <button type="submit" class="btn btn-primary" id="loginBtn"><span>登录</span></button>
    <p class="switch"><a href="/teacher">教师端</a></p>
  </form>
  <div id="setupPanel" class="panel" hidden>
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">Caller</span><span class="brand-role">管理端</span></div>
    <h1>还没有管理员账号</h1>
    <p class="sub">请联系部署负责人创建管理员账号。</p>
    <a class="btn btn-secondary" href="/admin">重新检查</a>
  </div>
  <footer class="version-footer"><a class="app-version" data-app-version hidden href="https://github.com/xzygreen/class-caller" target="_blank" rel="noopener noreferrer" title="GitHub · xzygreen/class-caller（新标签页打开）"></a></footer>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="top-in">
      <div class="ident">
        <a class="brand" href="/admin"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">Caller</span><span class="brand-role">管理端</span></a>
      </div>
      <div class="states" id="schoolState" aria-label="全校状态">
        <span class="status" id="windowPill"><svg data-icon="clock"></svg><span id="windowText">作息</span></span>
        <span class="status" id="fleetPill" hidden><svg data-icon="monitor"></svg><span id="fleetText"></span></span>
      </div>
      <div class="menu-wrap">
        <button class="who" id="whoBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="whoMenu" aria-label="个人菜单">
          <span class="avatar" id="avatar" aria-hidden="true"></span><span class="who-name" id="whoami"></span><svg data-icon="down"></svg>
        </button>
        <div class="menu" id="whoMenu" hidden>
          <div class="menu-head" id="whoHead"></div>
          <a href="/teacher"><svg data-icon="users"></svg>教师端</a>
          <button type="button" class="danger" id="logout"><svg data-icon="logout"></svg>退出登录</button>
        </div>
      </div>
    </div>
    <div class="tabs" id="groups" role="tablist" aria-label="管理分区">
      <button type="button" role="tab" data-group="today" aria-selected="true">今日<span class="count" id="gToday"></span></button>
      <button type="button" role="tab" data-group="org" aria-selected="false" tabindex="-1">组织</button>
      <button type="button" role="tab" data-group="dispatch" aria-selected="false" tabindex="-1">调度<span class="count" id="gDispatch"></span></button>
      <button type="button" role="tab" data-group="security" aria-selected="false" tabindex="-1">安全</button>
    </div>
  </header>

  <div class="shell admin">
    <nav class="sidenav" id="nav" aria-label="分区内页面">
      <div class="nav-group" data-group="today">
        <button type="button" data-view="overview"><svg data-icon="grid"></svg>概览</button>
        <button type="button" data-view="requests"><svg data-icon="inbox"></svg>待审批<span class="count" id="navRequests"></span></button>
      </div>
      <div class="nav-group" data-group="org" hidden>
        <button type="button" data-view="classes"><svg data-icon="school"></svg>班级与学生</button>
        <button type="button" data-view="users"><svg data-icon="users"></svg>教师与权限</button>
      </div>
      <div class="nav-group" data-group="dispatch" hidden>
        <button type="button" data-view="windows"><svg data-icon="clock"></svg>全校作息</button>
        <button type="button" data-view="schedules"><svg data-icon="calendar"></svg>定时任务<span class="count" id="navSchedules"></span></button>
        <button type="button" data-view="displays"><svg data-icon="monitor"></svg>大屏与设备<span class="count" id="navDisplays"></span></button>
      </div>
      <div class="nav-group" data-group="security" hidden>
        <button type="button" data-view="audit"><svg data-icon="file"></svg>操作记录</button>
        <button type="button" data-view="settings"><svg data-icon="sliders"></svg>系统设置</button>
      </div>
    </nav>

    <main id="main" tabindex="-1">
      <!-- 概览：先放今天必须处理的事 -->
      <section id="view-overview" class="stack" aria-labelledby="ovTitle">
        <div class="page-head">
          <div><h1 id="ovTitle">今日</h1><p id="ovDate"></p></div>
        </div>
        <div id="todo"></div>
        <section class="panel" aria-labelledby="ovSignalTitle">
          <div class="panel-head"><h2 id="ovSignalTitle">各班信号</h2></div>
          <div id="ovDisplays" class="dossiers"></div>
        </section>
      </section>

      <!-- 申请 -->
      <section id="view-requests" class="stack" hidden aria-labelledby="reqTitle">
        <div class="page-head">
          <div><h1 id="reqTitle">班级管理申请</h1></div>
          <label class="field inline-field"><span>状态</span><select id="reqStatus"><option value="pending">待审批</option><option value="">全部</option><option value="approved">已批准</option><option value="rejected">已拒绝</option></select></label>
        </div>
        <section class="panel"><div id="requests" class="list"></div></section>
      </section>

      <!-- 班级 -->
      <section id="view-classes" class="stack" hidden aria-labelledby="clsTitle">
        <div class="page-head">
          <div><h1 id="clsTitle">班级与学生</h1></div>
          <button type="button" class="btn btn-primary" id="newClass"><svg data-icon="plus"></svg><span>新建班级</span></button>
        </div>
        <div id="classList" class="stack"></div>
      </section>

      <!-- 教师 -->
      <section id="view-users" class="stack" hidden aria-labelledby="usrTitle">
        <div class="page-head">
          <div><h1 id="usrTitle">教师与权限</h1></div>
          <button type="button" class="btn btn-primary" id="newUser"><svg data-icon="plus"></svg><span>创建账号</span></button>
        </div>
        <section class="panel flush">
          <div class="panel-head">
            <label class="search user-search"><svg data-icon="search"></svg><span class="sr-only">搜索账号</span><input type="search" id="userFilter" placeholder="搜索姓名或登录名"></label>
            <span class="muted" id="userCount"></span>
          </div>
          <div class="table-wrap"><table id="userTable" class="cards"><thead><tr><th>姓名</th><th>登录名</th><th>角色</th><th>状态</th><th>已授权班级</th><th>最近登录</th><th><span class="sr-only">操作</span></th></tr></thead><tbody></tbody></table></div>
        </section>
      </section>

      <!-- 作息 -->
      <section id="view-windows" class="stack" hidden aria-labelledby="winTitle">
        <div class="page-head">
          <div><h1 id="winTitle">全校作息</h1><p id="tzLabel"></p></div>
        </div>
        <section class="panel">
          <fieldset class="plain-fieldset"><legend class="label">上课日</legend>
            <div id="wDays" class="checks">
              <label class="check"><input type="checkbox" value="1"> 周一</label><label class="check"><input type="checkbox" value="2"> 周二</label>
              <label class="check"><input type="checkbox" value="3"> 周三</label><label class="check"><input type="checkbox" value="4"> 周四</label>
              <label class="check"><input type="checkbox" value="5"> 周五</label><label class="check"><input type="checkbox" value="6"> 周六</label>
              <label class="check"><input type="checkbox" value="0"> 周日</label>
            </div>
          </fieldset>
          <div class="table-wrap"><table id="wTable" class="cards"><thead><tr><th>开始</th><th>结束</th><th>说明</th><th><span class="sr-only">操作</span></th></tr></thead><tbody></tbody></table></div>
          <div class="row" style="margin-top:var(--gap-item)">
            <button class="btn btn-secondary btn-sm" id="wAdd" type="button"><svg data-icon="plus"></svg><span>添加时段</span></button>
            <button class="btn btn-ghost btn-sm" id="wDefault" type="button">恢复默认作息</button>
            <span class="spacer"></span>
            <button class="btn btn-primary" id="wSave" type="button"><span>保存作息</span></button>
          </div>
        </section>
      </section>

      <!-- 定时任务 -->
      <section id="view-schedules" class="stack" hidden aria-labelledby="schTitle">
        <div class="page-head">
          <div><h1 id="schTitle">定时任务</h1></div>
        </div>
        <section class="panel"><div id="schedules" class="list"></div></section>
      </section>

      <!-- 大屏 -->
      <section id="view-displays" class="stack" hidden aria-labelledby="dspTitle">
        <div class="page-head">
          <div><h1 id="dspTitle">大屏与设备</h1></div>
        </div>
        <section class="panel"><div id="displays" class="list"></div></section>
        <section class="panel urgent-panel" aria-labelledby="ugTitleH">
          <div class="panel-head"><h2 id="ugTitleH"><svg data-icon="alert"></svg>紧急广播</h2></div>
          <form id="urgentForm" class="grid2">
            <label class="field"><span>班级</span><select id="ugClass" required></select></label>
            <label class="field"><span>自动下屏</span><select id="ugDuration"><option value="300">5 分钟后</option><option value="900">15 分钟后</option><option value="3600">1 小时后</option><option value="0">手动撤回</option></select></label>
            <label class="field span-all"><span>标题</span><input type="text" id="ugTitle" maxlength="30" required placeholder="例：全体注意"></label>
            <label class="field span-all"><span>正文</span><textarea id="ugBody" maxlength="300" required></textarea></label>
            <div class="field span-all row end"><button type="submit" class="btn btn-danger-quiet" id="ugSend"><svg data-icon="megaphone"></svg><span>发送紧急广播…</span></button></div>
          </form>
        </section>
      </section>

      <!-- 审计 -->
      <section id="view-audit" class="stack" hidden aria-labelledby="audTitle">
        <div class="page-head">
          <div><h1 id="audTitle" tabindex="-1">操作记录</h1></div>
          <div class="row">
            <label class="field inline-field"><span>类别</span>
              <select id="auditFilter">
                <option value="">全部</option><option value="access.">班级权限</option><option value="user.">账号</option>
                <option value="class.">班级与名单</option><option value="notice.">通知</option><option value="display.">大屏</option>
                <option value="schedule.">定时任务</option><option value="call_windows.">作息</option><option value="settings.">设置</option><option value="session.">会话</option>
              </select>
            </label>
            <button class="btn btn-secondary btn-sm" id="auditReload" type="button"><svg data-icon="refresh"></svg><span>刷新</span></button>
          </div>
        </div>
        <nav class="audit-pagination" aria-label="操作记录分页（顶部）">
          <p data-audit-page role="status"></p>
          <div class="row">
            <button class="btn btn-secondary btn-sm" type="button" data-audit-step="-1" disabled>上一页</button>
            <button class="btn btn-secondary btn-sm" type="button" data-audit-step="1" disabled>下一页</button>
          </div>
        </nav>
        <section class="panel flush">
          <div class="table-wrap"><table id="auditTable" class="cards"><thead><tr><th>时间</th><th>操作者</th><th>操作</th><th>来源</th></tr></thead><tbody></tbody></table></div>
        </section>
        <nav class="audit-pagination" aria-label="操作记录分页（底部）">
          <p data-audit-page></p>
          <div class="row">
            <button class="btn btn-secondary btn-sm" type="button" data-audit-step="-1" disabled>上一页</button>
            <button class="btn btn-secondary btn-sm" type="button" data-audit-step="1" disabled>下一页</button>
          </div>
        </nav>
      </section>

      <!-- 设置 -->
      <section id="view-settings" class="stack" hidden aria-labelledby="setTitle">
        <div class="page-head"><div><h1 id="setTitle">系统设置</h1></div></div>
        <section class="panel">
          <label class="field"><span>教师发布的普通留言</span>
            <select id="setPolicy"><option value="immediate">立即显示</option><option value="next_window">在点人时段显示</option></select>
          </label>
          <button class="btn btn-primary btn-sm" id="setSave" type="button"><span>保存</span></button>
        </section>
        <section class="panel danger-zone">
          <button class="btn btn-danger-quiet btn-sm" id="revokeAll" type="button"><span>强制所有人重新登录…</span></button>
        </section>
      </section>
    </main>
  </div>
  <footer class="version-footer"><a class="app-version" data-app-version hidden href="https://github.com/xzygreen/class-caller" target="_blank" rel="noopener noreferrer" title="GitHub · xzygreen/class-caller（新标签页打开）"></a></footer>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<script src="ui.js?v=2.1.8"></script>
<script src="version.js?v=2.1.8"></script>
<script src="admin.js?v=2.1.8"></script>
</body>
</html>
