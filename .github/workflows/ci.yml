name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run tests
        run: npm test

  browser:
    name: Browser DOM and accessibility (no screenshots)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Locate runner Chrome
        shell: bash
        run: |
          for browser in google-chrome google-chrome-stable chromium chromium-browser; do
            if executable="$(command -v "$browser")"; then
              printf 'CHROME_PATH=%s\n' "$executable" >> "$GITHUB_ENV"
              "$executable" --version
              exit 0
            fi
          done
          printf 'Chrome is required for executable DOM/AX regressions; refusing to skip.\n' >&2
          exit 1
      - name: Run real-browser audit regressions with built-in Node CDP client
        run: npm run test:browser:fixes

  display:
    name: Build display.exe (Windows 7 x86)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install C and x86 MinGW toolchains
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc gcc-mingw-w64-i686 binutils-mingw-w64-i686 file
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build display.exe
        run: bash windows-display/build-mingw-x86.sh
      - name: Build win7-launcher.exe
        run: bash windows-launcher/build-mingw-x86.sh
      - name: Run required executable native contracts and fresh PE checks
        env:
          CC_NATIVE_REQUIRE: "1"
        run: node --test test/launcher.test.js test/display.test.js
      - name: Upload display.exe
        uses: actions/upload-artifact@v4
        with:
          name: display-win7-x86-${{ github.sha }}
          path: |
            windows-display/build/display.exe
            windows-launcher/build/win7-launcher.exe
          if-no-files-found: error
          retention-days: 30
