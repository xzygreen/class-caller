name: Build and release display.exe

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v2.1.6 (never creates or overwrites a release)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  # Manual dispatches from different branches must serialize on the target tag.
  group: release-display-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build Windows 7 x86 release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out release tooling and existing tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve existing tag to a commit
        id: source
        shell: bash
        run: |
          commit="$(node scripts/verify-release.js resolve "$RELEASE_TAG")"
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
          # Keep these guards when checking out an older tag without the tooling.
          cp scripts/verify-release.js "$RUNNER_TEMP/verify-release.js"

      - name: Check out exactly the release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked-out HEAD matches the tag
        run: node "$RUNNER_TEMP/verify-release.js" source "$RELEASE_TAG"

      - name: Install C and x86 MinGW toolchains
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc gcc-mingw-w64-i686 binutils-mingw-w64-i686 file zip

      - name: Build display.exe and win7-launcher.exe from this source
        run: |
          bash windows-display/build-mingw-x86.sh
          bash windows-launcher/build-mingw-x86.sh

      - name: Run tests, including required native contracts and fresh PE checks
        env:
          CC_NATIVE_REQUIRE: "1"
        run: npm test

      - name: Prepare release files
        shell: bash
        run: |
          mkdir dist
          asset="ClassCallerDisplay-${RELEASE_TAG}-win7-x86.exe"
          bundle="ClassCallerDisplay-${RELEASE_TAG}-win7-x86"
          cp windows-display/build/display.exe "dist/$asset"
          mkdir "dist/$bundle"
          cp windows-display/build/display.exe "dist/$bundle/display.exe"
          cp windows-display/display.ini.example "dist/$bundle/display.ini"
          cp windows-display/start-display.cmd "dist/$bundle/start-display.cmd"
          cp windows-display/install-autostart.cmd "dist/$bundle/install-autostart.cmd"
          cp windows-display/uninstall-autostart.cmd "dist/$bundle/uninstall-autostart.cmd"
          cp docs/windows-display.md "dist/$bundle/README.md"
          cp LICENSE NOTICE.md PRIVACY.md "dist/$bundle/"
          (
            cd dist
            zip -9 -r "$bundle.zip" "$bundle"
          )
          # Verify the distributed privacy policy, not just the source document.
          unzip -p "dist/$bundle.zip" "$bundle/PRIVACY.md" | cmp PRIVACY.md -
          rm -rf "dist/$bundle"
          file "dist/$asset"
          i686-w64-mingw32-objdump -f "dist/$asset" | grep -E 'file format|architecture'
          node "$RUNNER_TEMP/verify-release.js" manifest "$RELEASE_TAG" dist
          node "$RUNNER_TEMP/verify-release.js" verify "$RELEASE_TAG" dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClassCallerDisplay-${{ env.RELEASE_TAG }}-win7-x86
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/release-notes.txt" <<'EOF'
          ## 使用前必须配置

          解压 ZIP 后，请先打开 `display.ini`，填写实际部署信息：

          - `server=`：真实的服务网址，例如 `https://你的域名`
          - `class_id=`：这台大屏对应的班级 ID

          公开发布包不会包含真实服务网址、班级配置、学生名单或密码。配置完成后再运行 `display.exe` 或 `start-display.cmd`。

          `release-manifest.json` 记录源码标签、提交、工具链及文件 SHA-256；下载后请先核对校验文件。该版本资产不可覆盖，修复请发布新标签。
          EOF
          # Re-check HEAD/tag and every checksum immediately before publication.
          # Existing releases (including partial/draft releases) are refused.
          node "$RUNNER_TEMP/verify-release.js" publish "$RELEASE_TAG" dist "$RUNNER_TEMP/release-notes.txt"
